# Publishes to npm, only when started: `release.sh` starts it after a merge to
# master, with the sha of the commit to publish. For each package under
# `packages/` that isn't private, it publishes the version in its package.json
# if npm doesn't have it yet, and creates the GitHub release `<name>@<version>`
# if that's missing. So to release, bump the version in your PR.
#
# It runs no checks: a PR is checked before it merges (see `checks.sh`).
#
# Auth is npm trusted publishing (OIDC): no npm token is stored anywhere.
# Each package must list this repo and workflow file (publish.yml) as a
# trusted publisher on npmjs.com, so don't rename this file.
name: Publish
run-name: Publish ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full sha of the commit to publish. It must be on master.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      # A run can only be started on a branch or a tag, which may have moved
      # on by the time it starts. So the commit comes as an input, and every
      # job checks out exactly that commit.
      - name: Check that this was started on master, with a full sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::Start this workflow on master, not on $GITHUB_REF."
            exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$SHA' is not a full commit sha."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Check that the commit is on master
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), not $SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on master."
            exit 1
          fi
      - id: detect
        name: Find packages whose version isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=()
          for dir in packages/*/; do
            dir=${dir%/}
            # A package marked private isn't ready to be released.
            if [ "$(jq -r '.private // false' "$dir/package.json")" = true ]; then
              echo "$dir is private"
              continue
            fi
            version=$(jq -r .version "$dir/package.json")
            id="$(jq -r .name "$dir/package.json")@$version"
            if [ "$(npm view "$id" version 2>/dev/null)" != "$version" ]; then
              echo "$id will be published"
              pending+=("$dir")
            elif ! gh release view "$id" >/dev/null 2>&1; then
              echo "$id is on npm, and will get its GitHub release"
              pending+=("$dir")
            else
              echo "$id is already released"
            fi
          done
          echo "packages=$(jq -cn '$ARGS.positional' --args "${pending[@]}")" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: jdx/mise-action@v5
      # Trusted publishing needs npm 11.5.1+, newer than node 22 ships with.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Both steps skip what an earlier run already did, so a run that failed
      # halfway can be started again.
      - name: Publish to npm
        run: |
          version=$(jq -r .version package.json)
          id="$(jq -r .name package.json)@$version"
          if [ "$(npm view "$id" version 2>/dev/null)" = "$version" ]; then
            echo "$id is already on npm"
            exit 0
          fi
          # Prereleases (1.2.0-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --tag "$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          version=$(jq -r .version package.json)
          id="$(jq -r .name package.json)@$version"
          if gh release view "$id" >/dev/null 2>&1; then
            echo "$id already has its GitHub release"
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$id" --target "$SHA" --title "$id" --generate-notes "${flags[@]}"
