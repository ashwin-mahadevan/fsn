# Publishes to npm on every push to master. A package is published when the
# version in its package.json isn't on npm yet, so to release, bump the
# version in your PR. Checks run first, and nothing publishes if they fail.
#
# Auth is npm trusted publishing (OIDC): no npm token is stored in GitHub.
# Each package must list this repo and workflow file (publish.yml) as a
# trusted publisher on npmjs.com.
name: Publish
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        name: Find packages whose version isn't on npm yet
        run: |
          pending=()
          for dir in packages/*/; do
            dir=${dir%/}
            # A package marked private isn't ready to be released.
            if [ "$(jq -r '.private // false' "$dir/package.json")" = true ]; then
              echo "$dir is private"
              continue
            fi
            id="$(jq -r .name "$dir/package.json")@$(jq -r .version "$dir/package.json")"
            if npm view "$id" version >/dev/null 2>&1; then
              echo "$id is already on npm"
            else
              echo "$id will be published"
              pending+=("$dir")
            fi
          done
          echo "packages=$(jq -cn '$ARGS.positional' --args "${pending[@]}")" >> "$GITHUB_OUTPUT"

  checks:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    uses: ./.github/workflows/checks.yml

  publish:
    name: publish (${{ matrix.package }})
    needs: [detect, checks]
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Trusted publishing needs npm 11.5.1+, newer than node 22 ships with.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Publish to npm
        run: |
          version=$(jq -r .version package.json)
          # Prereleases (1.2.0-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --tag "$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          id="$(jq -r .name package.json)@$version"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$id" --target "$GITHUB_SHA" --title "$id" --generate-notes "${flags[@]}"
