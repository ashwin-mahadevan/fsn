name: Stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: >
            This issue has been inactive for 30 days.
            It will be closed in 14 days if there is no further activity.
          stale-pr-message: >
            This PR has been inactive for 30 days.
            It will be closed in 14 days if there is no further activity.
          close-issue-message: "Closing due to inactivity. Re-open if this is still relevant."
          close-pr-message: "Closing due to inactivity. Re-open if this is still relevant."
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
